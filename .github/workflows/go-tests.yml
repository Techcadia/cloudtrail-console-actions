name: Go Tests
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # The release workflow calls this so a tag is only built after tests pass.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Go vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: make vet
      - name: Test
        run: go test -race ./...

  policy-lint:
    name: Lint policy YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: pipx run --spec yamllint==1.35.1 yamllint --strict internal/policy/default.yaml .yamllint
      # Keeps policy.schema.json (used by editors) in step with the default policy.
      - name: Validate against policy.schema.json
        run: pipx run --spec check-jsonschema==0.29.4 check-jsonschema --schemafile policy.schema.json internal/policy/default.yaml
